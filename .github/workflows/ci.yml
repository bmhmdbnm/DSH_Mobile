# CI — 只跑「干净机器上也能跑」的那一半
#
# 边界是刻意的：这里覆盖协议层、连接器、插件与中转的单测，以及**不带本机配置文件**
# 的 App 构建（也就是别人 clone 下来的样子）。它要回答的问题是「这个仓库本身能不能
# 构建、能不能过测试」，而不是「作者的机器上能不能过」。
#
# 不进 CI 的（仍需在真机上按规范验）：
#   * 仿真器逐屏核对 —— 要一台 macOS + 仿真器 + 真实中转，且判定靠看图，不是断言；
#   * 经公网中转的手机端验证 —— 需要 `~/.dsh/mobile-link/agent.json` 里的真实身份；
#   * 发布前归档 —— 需要开发者团队 ID（`DSH_TEAM_ID` / `Signing.local.plist`），
#     那是开发者私有的，不进公共 runner；
#   * 重启 DSH 后的连接验证 —— 依赖本机进程与真实会话。
# 把这几项塞进 CI 只会得到假绿灯：DSHKit 的集成测试在公共 runner 上会整片 skip。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发：仓库网页 Actions → 这个工作流 → Run workflow，不必等下一次 push。
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 本机的真值都不入库，这是这个仓库最容易犯的错，所以单独一条先跑。
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 本机专用的文件没有被提交
        run: |
          set -e
          status=0
          for path in .env.local AGENTS.md \
                      ios/DSHMobile/Config.local.xcconfig \
                      ios/DSHMobile/Signing.local.plist; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::$path 被跟踪了——它装的是本机真值，必须留在 .gitignore 里"
              status=1
            else
              echo "ok  $path 未入库"
            fi
          done
          exit $status
      - name: 跟踪文件里没有家目录路径、也没有凭据形状的字符串
        run: |
          set -e
          # 文档与样例统一写占位家目录（/Users/example、/Users/you、/Users/...）。
          # 除此之外的 /Users/<名字> 都当成真实家目录——白名单而不是黑名单，
          # 免得把真实名字写进这个文件，那本身就是泄漏。
          allowed='example|you|your|yourname|user|username|me|someone|name|placeholder|x|dev|\.\.\.'
          if git grep -n -I -o -E '/Users/[A-Za-z0-9._-]+' -- . | grep -v -E "/Users/($allowed)$"; then
            echo "::error::上面这些行里有真实家目录路径"; exit 1
          fi
          # agentId / agentSecret 的真值比测试夹具长得多，夹具都是短名（agt_cfg 之类）。
          if git grep -n -I -E '\b(agt|acc|dev)_[A-Za-z0-9_-]{16,}|\bas_[A-Za-z0-9_-]{16,}' -- .; then
            echo "::error::上面这些行像真实凭据，检查一遍"; exit 1
          fi
          echo "ok  没发现家目录或凭据形状的字符串"
      - name: 真值检查（邀请码形状、真实中转地址、本机凭据）
        # 同一个脚本也能在本机跑（`npm run check:secrets`）：有 .env.local 时连真实值
        # 一起比对，公共 runner 上没有它，就只跑不依赖真值的形状检查。
        # 想在 CI 里也比对真实主机，就在仓库 secrets 里配 DSH_SITE / DSH_RELAY_URL。
        env:
          DSH_SITE: ${{ secrets.DSH_SITE }}
          DSH_RELAY_URL: ${{ secrets.DSH_RELAY_URL }}
        run: node scripts/dev/check-secrets.mjs

  # 仓库卫生 + 契约检查 + 脚本单测。这三样都是"离线、几秒、不需要平台"的检查，
  # 放同一个 job：contracts 是文本级守卫（三端读同一份向量 / 安装目录阶梯 /
  # 调试钩子闸门），它必须进 CI —— 不进 CI 的守卫等于没有。
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 文档规范（结构、口吻、链接、本机路径）与真值检查同属"仓库卫生"，
      # 但单独一条：出问题时一眼看出是文档还是凭据。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:docs
      - name: 契约守卫（DLP 向量接线 / 安装目录阶梯 / 调试钩子闸门 / 单一来源）
        run: npm run check:contracts
      - name: 脚本单测（含测试台与契约检查自身的用例）
        run: npm run test:scripts
      # 纯文本解析 + readdirSync，不依赖 macOS / Xcode / 网络（本机 0.3s），
      # 所以放在这个 Ubuntu job 里跑没有平台风险，不必新建 job。
      - name: 本地化检查（双向缺键 / 硬编码 / 未本地化绑定）
        run: npm run check:i18n

  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - plugins/mobile-link
          - plugins/send-image
          - plugins/doubao-image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: ${{ matrix.package }}
        working-directory: ${{ matrix.package }}
        # 插件在机器上跑时会读 $DSH_HOME；CI 里没有真的 home，显式指到临时目录，
        # 免得哪条用例哪天开始悄悄依赖公共 runner 的家目录。
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: mkdir -p "$DSH_HOME" && npm test

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 端到端那半（test_caddy_runtime.py）要一个真的网关：文本级断言曾经全绿，
      # 而生产上 /dsh-link/stats 正在 200 返回整页——只有真请求能抓住指令排序。
      - name: 装 caddy（端到端那半要一个真的网关）
        run: |
          set -e
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update && sudo apt-get install -y caddy
      # 这一步不能省：装不上时 skipif 会把 5 个用例变成 skipped，CI 反而"更绿"。
      - name: 确认 caddy 真的装上了（否则会静默退化成 skip）
        run: command -v caddy && caddy version
      # 装的是 requirements-dev.txt——`aiohttp_client` 这个 fixture 来自 pytest-aiohttp，
      # 曾经只装在作者本机的 venv 里，clone 下来跑必然一片 setup error。
      - run: pip install -r relay/requirements-dev.txt
      - run: mkdir -p "$DSH_HOME" && python -m pytest -q
        working-directory: relay
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
          # 硬性要求 caddy 在场：没有它就收集报错，而不是静默 skip。
          DSH_REQUIRE_CADDY: '1'

  dshkit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test（协议层）
        working-directory: ios/DSHMobile/DSHKit
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: mkdir -p "$DSH_HOME" && swift test

  app-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release 构建：clone 下来的样子（没有本机 xcconfig）
        working-directory: ios/DSHMobile
        run: |
          set -o pipefail
          xcodebuild -project DSHMobile.xcodeproj -scheme DSHMobile \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" build | tail -5
      - name: 构建产物必须回落到占位符地址
        working-directory: ios/DSHMobile
        run: |
          set -e
          plist="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/DSHMobile.app/Info.plist"
          relay=$(plutil -extract DSHRelayURL raw -o - "$plist")
          feed=$(plutil -extract DSHUpdateFeed raw -o - "$plist")
          echo "relayURL   = $relay"
          echo "updateFeed = $feed"
          # 没有 Config.local.xcconfig 时，xcconfig 里的占位符必须原样进包：
          # 一旦这里变成别的值，说明又有真值被写进了被跟踪的文件。
          [ "$relay" = 'https://relay.example.com/dsh-link' ] \
            || { echo "::error::relayURL 不是占位符，检查 Config.xcconfig 与 Info.plist"; exit 1; }
          [ "$feed" = 'https://relay.example.com/ios/version.json' ] \
            || { echo "::error::updateFeed 不是占位符，检查 Config.xcconfig 与 Info.plist"; exit 1; }
      - name: Release 产物里不许有调试启动参数
        working-directory: ios/DSHMobile
        run: |
          set -e
          bin="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/DSHMobile.app/DSHMobile"
          status=0
          # 只有这两个名字能靠字符串搜索验：`-DSHDemoMode` 是 12 字节，
          # Swift 会把它做成立即数直接编进指令流，**改前改后都搜不到**，
          # 「0 命中」对它没有诊断力。它由 `npm run check:contracts` 的源码闸门
          # 与一次 Release 行为对照守着（见 docs/relay-contract.json 与批 2 报告）。
          for hook in -DSHForgetDirect -DSHFailAttachmentLoad; do
            count=$(grep -c --text -- "$hook" "$bin" || true)
            echo "$hook -> $count"
            if [ "$count" != "0" ]; then
              echo "::error::$hook 进了 Release 产物——调试钩子必须在 #if DEBUG 里"
              status=1
            fi
          done
          exit $status

  # 006：选择性拦截。CI 跑得了 L1/L2 的等价部分——就是上面那些作业（它们红了 PR 就红）；
  # 跑不了 L3（干净 guest、真实手机、TestFlight 都不在 runner 上）。所以这里只做两件事：
  #   ① 矩阵与渠道入口的守卫（缺格、重复、理由缺失、npm 脚本漂移 → exit 2）；
  #   ② 改动要求 L3 时，必须在改动记录（PR 正文或提交说明）里留痕：
  #      `L3: .lanes/runs/l3/<run-id>/verdict.json` 或 `L3: 未跑 — <理由>`。
  # 声明会被原样打印出来，不是"验过"，只是"不许静默跳过"。
  lanes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 这次改动必须跑哪几级（L3 缺留痕即失败）
        env:
          DSH_L3_DECLARATION: ${{ github.event.pull_request.body }} ${{ github.event.head_commit.message }}
        run: |
          set -e
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base='${{ github.event.before }}'
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base='HEAD~1'
          fi
          git diff --name-only "$base" HEAD > changed.txt
          echo "改动文件："; sed 's/^/  /' changed.txt
          node scripts/dev/check-lanes.mjs --changed-from changed.txt --ci
